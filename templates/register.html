{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}

<div class="auth-box">

    <h2>Create Librarian Account</h2>

    <form method="POST" autocomplete="off">

        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label>Full Name</label>
        <input type="text" name="name" placeholder="Enter your name" autocomplete="off" required>

        <label>Email Address</label>
        <input type="email" name="email" placeholder="example@email.com" autocomplete="off" required>

        <label>Password</label>
        <input type="password" name="password" placeholder="Create password" autocomplete="new-password" required>

        <label>Confirm Password</label>
        <input type="password" name="confirm_password" placeholder="Confirm password" autocomplete="new-password" required>

        <button type="submit">Register</button>

    </form>

    <p>Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>

</div>

{% endblock %}

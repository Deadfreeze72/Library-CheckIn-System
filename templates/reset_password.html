{% extends "base.html" %}

{% block body_class %}auth-page{% endblock %}

{% block title %}Choose a New Password{% endblock %}

{% block content %}

<div class="auth-box">

    <div class="auth-logo">
        <img class="logo-img" src="{{ url_for('static', filename='images/crest.png') }}" alt="St. John Bosco College of Education crest">
        <span class="brand-primary">St. John Bosco College of Education</span>
        <span class="brand-secondary">Library Management System</span>
    </div>

    <h2>Choose a New Password</h2>

    <form method="POST" autocomplete="off">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label>New Password (at least 8 characters)</label>
        <input type="password" name="new_password" autocomplete="new-password" required>

        <label>Confirm New Password</label>
        <input type="password" name="confirm_password" autocomplete="new-password" required>

        <button type="submit">Save New Password</button>
    </form>

</div>

{% endblock %}
